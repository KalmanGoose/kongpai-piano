<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空拍 (Pause ll) - 呂允 100% 原調 D♭ 真實鋼琴琴譜</title>
  <style>
    :root {
      --bg: #0b0d11;
      --card-bg: #151821;
      --card-inner: #1c202d;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --key-white: #ffffff;
      --key-black: #1e293b;
      --active-key: #0284c7;
      --guided-white: #fef08a;
      --guided-black: #f59e0b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 40px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge-pure {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 960px;
    }

    /* 頂部進度條 */
    .progress-bar-container {
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #252a38;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.15s ease;
    }

    .sections-nav {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
    }

    .section-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .section-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.18);
      font-weight: 800;
    }

    /* 核心舞台卡片 */
    .stage-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }

    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pill-btn {
      background: #1c202d;
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .pill-btn.active {
      background: var(--primary);
      color: #0f172a;
      font-weight: 800;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    .combo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* 主畫面舞台 */
    .song-stage {
      text-align: center;
      padding: 28px 16px;
      background: var(--card-inner);
      border-radius: 14px;
      position: relative;
      transition: background 0.15s;
    }

    .song-stage.success-flash {
      background: rgba(16, 185, 129, 0.25);
    }

    .phrase-line {
      font-size: 18px;
      color: #94a3b8;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .phrase-line span.active-char {
      color: #38bdf8;
      font-weight: 900;
      font-size: 22px;
      border-bottom: 3px solid var(--accent);
      padding-bottom: 2px;
    }

    .target-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
    }

    .current-word {
      font-size: 72px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }

    .current-note {
      font-size: 38px;
      font-weight: 900;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
    }

    .prompt-box {
      font-size: 16px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .key-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #0f172a;
      font-weight: 900;
      font-size: 24px;
      padding: 6px 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
      font-family: ui-monospace, monospace;
      animation: pulse 1s infinite alternate;
    }

    .next-preview {
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 20px;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* 鋼琴鍵盤容器 */
    .piano-box {
      background: #14171f;
      border-radius: 16px;
      padding: 14px 16px 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      border: 2px solid #282e3d;
      position: relative;
    }

    .piano-board {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
    }

    .white-keys {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .white-key {
      flex: 1;
      height: 100%;
      background: var(--key-white);
      border: 1px solid #cbd5e1;
      border-radius: 0 0 6px 6px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      cursor: pointer;
      transition: background 0.05s, transform 0.05s;
    }

    .white-key.active {
      background: var(--active-key) !important;
      transform: translateY(2px);
    }

    .white-key.guided {
      background: var(--guided-white) !important;
      border-color: #f59e0b;
      box-shadow: inset 0 -12px 0 var(--guided-black);
    }

    .black-keys {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 135px;
      display: flex;
      pointer-events: none;
      z-index: 2;
    }

    .black-slot {
      flex: 1;
      position: relative;
    }

    .black-key {
      position: absolute;
      width: 62%;
      height: 100%;
      background: var(--key-black);
      right: -31%;
      border-radius: 0 0 5px 5px;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
      box-shadow: 2px 4px 6px rgba(0,0,0,0.6);
      transition: background 0.05s, transform 0.05s;
    }

    .black-key.active {
      background: var(--active-key) !important;
      transform: translateY(2px);
    }

    .black-key.guided {
      background: var(--guided-black) !important;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.9);
    }

    .kb-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.08);
      color: #0f172a;
      font-family: ui-monospace, Menlo, monospace;
    }

    .black-key .kb-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .note-sub {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }

    .black-key .note-sub {
      color: #cbd5e1;
    }

    /* 控制列 */
    .control-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button.btn-ctrl {
      background: #272c38;
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.btn-ctrl:hover {
      background: #333a4a;
      border-color: rgba(255,255,255,0.25);
    }

    button.btn-ctrl.active {
      background: var(--primary);
      color: #0f172a;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <span>呂允《空拍 (Pause ll)》純鋼琴單音演奏琴譜</span>
      <span class="badge-pure" id="badgeKey">原調 D♭ 大調 (100% 原聲)</span>
    </h1>
    <p>完全依據原曲錄音聲部！敲擊鍵盤發出真實音高，按對自動前進</p>
  </header>

  <div class="main-layout">
    <!-- 歌曲進度條 -->
    <div class="progress-bar-container">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);">
        <span id="lblSectionProgress">進度：前奏</span>
        <span id="lblProgressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="sections-nav" id="sectionNavContainer"></div>
    </div>

    <!-- 舞台展示區 -->
    <div class="stage-card">
      <div class="stage-top">
        <div class="btn-group">
          <button class="pill-btn active" id="btnKeyDb">🌟 原調 D♭ 大調 (原版原聲)</button>
          <button class="pill-btn" id="btnKeyC">白鍵 C 調 (降半音練習)</button>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
          <button class="pill-btn" id="btnModeAutoDemo">▶ 全曲旋律自動演示</button>
          <div class="combo-badge" id="comboBadge">
            <span>🔥 連擊</span>
            <span id="comboCount">0</span>
          </div>
        </div>
      </div>

      <div class="song-stage" id="stageBox">
        <div class="phrase-line" id="lblPhraseLine">不要說 他已遠走</div>
        <div class="target-display">
          <div class="current-word" id="lblWord">不</div>
          <div class="current-note" id="lblNote">Eb4 (降Re)</div>
        </div>
        <div class="prompt-box">
          MacBook 鍵盤請敲：
          <span class="key-badge" id="keyBadge">E</span>
          <span class="next-preview" id="lblNextPreview">下一個字：要 (Fa / F)</span>
        </div>
      </div>
    </div>

    <!-- 鋼琴鍵盤本體 -->
    <div class="piano-box">
      <div class="piano-board">
        <div class="white-keys" id="whiteKeys"></div>
        <div class="black-keys" id="blackKeys"></div>
      </div>
    </div>

    <!-- 控制功能列 -->
    <div class="control-actions">
      <div style="display:flex; gap:8px;">
        <button class="btn-ctrl" id="btnPrev">◀ 上一個音</button>
        <button class="btn-ctrl" id="btnNext">下一個音 ▶</button>
        <button class="btn-ctrl" id="btnReset">🔄 從頭開始</button>
      </div>
      <div style="font-size:13px; color:var(--text-muted);">
        ✨ 提示：切換至原調 D♭ 後，敲擊發光的按鍵，聲音就與 YouTube 官方 MV 音高完全一模一樣！
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. 純淨平台鋼琴合成器 (Web Audio API)
    // -------------------------------------------------------------
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPurePianoNote(freq, delay = 0, duration = 2.4, gainLevel = 0.45) {
      initAudio();
      const now = audioCtx.currentTime + delay;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 2, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(gainLevel, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(gainLevel * 0.45, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + duration + 0.1);
      osc2.stop(now + duration + 0.1);
    }

    // -------------------------------------------------------------
    // 2. MacBook 鍵盤映射 (白鍵 A S D F G H J K L ; / 黑鍵 W E T Y U O P)
    // -------------------------------------------------------------
    const keysDef = [
      { note: 'C4', key: 'A', isBlack: false, freq: 261.63, solfege: 'Do' },
      { note: 'C#4/Db4', key: 'W', isBlack: true, freq: 277.18, solfege: '降Do' },
      { note: 'D4', key: 'S', isBlack: false, freq: 293.66, solfege: 'Re' },
      { note: 'D#4/Eb4', key: 'E', isBlack: true, freq: 311.13, solfege: '降Re' },
      { note: 'E4', key: 'D', isBlack: false, freq: 329.63, solfege: 'Mi' },
      { note: 'F4', key: 'F', isBlack: false, freq: 349.23, solfege: 'Fa' },
      { note: 'F#4/Gb4', key: 'T', isBlack: true, freq: 369.99, solfege: '降Sol' },
      { note: 'G4', key: 'G', isBlack: false, freq: 392.00, solfege: 'Sol' },
      { note: 'G#4/Ab4', key: 'Y', isBlack: true, freq: 415.30, solfege: '降La' },
      { note: 'A4', key: 'H', isBlack: false, freq: 440.00, solfege: 'La' },
      { note: 'A#4/Bb4', key: 'U', isBlack: true, freq: 466.16, solfege: '降Si' },
      { note: 'B4', key: 'J', isBlack: false, freq: 493.88, solfege: 'Si' },
      { note: 'C5', key: 'K', isBlack: false, freq: 523.25, solfege: '高音Do' },
      { note: 'C#5/Db5', key: 'O', isBlack: true, freq: 554.37, solfege: '高音降Do' },
      { note: 'D5', key: 'L', isBlack: false, freq: 587.33, solfege: '高音Re' },
      { note: 'D#5/Eb5', key: 'P', isBlack: true, freq: 622.25, solfege: '高音降Re' },
      { note: 'E5', key: ';', isBlack: false, freq: 659.25, solfege: '高音Mi' },
      { note: 'F5', key: "'", isBlack: false, freq: 698.46, solfege: '高音Fa' },
    ];

    const keyMap = {};
    keysDef.forEach(k => keyMap[k.key.toUpperCase()] = k);

    const whiteContainer = document.getElementById('whiteKeys');
    const blackContainer = document.getElementById('blackKeys');

    keysDef.forEach(k => {
      if (!k.isBlack) {
        const el = document.createElement('div');
        el.className = 'white-key';
        el.id = `key-${k.key}`;
        el.innerHTML = `
          <div class="kb-badge">${k.key}</div>
          <div class="note-sub">${k.note.split('/')[0]}</div>
        `;
        el.addEventListener('mousedown', () => pressKey(k.key));
        whiteContainer.appendChild(el);

        const slot = document.createElement('div');
        slot.className = 'black-slot';
        slot.id = `slot-${k.key}`;
        blackContainer.appendChild(slot);
      } else {
        const prev = keysDef[keysDef.indexOf(k) - 1];
        const slot = document.getElementById(`slot-${prev.key}`);
        if (slot) {
          const el = document.createElement('div');
          el.className = 'black-key';
          el.id = `key-${k.key}`;
          el.innerHTML = `
            <div class="kb-badge">${k.key}</div>
            <div class="note-sub">${k.note.split('/')[1] || k.note}</div>
          `;
          el.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            pressKey(k.key);
          });
          slot.appendChild(el);
        }
      }
    });

    // -------------------------------------------------------------
    // 3. 呂允《空拍》真實旋律音符 (原調 D♭ 大調 100% 原聲)
    // -------------------------------------------------------------
    const melodyDb = [
      // === 前奏 INTRO ===
      { sec: '前奏 Intro', word: '♫ 前奏1', note: 'Ab4 (降La)', key: 'Y', phrase: '（鋼琴原版前奏）' },
      { sec: '前奏 Intro', word: '♫ 前奏2', note: 'Eb5 (高音降Re)', key: 'P', phrase: '（高音透明感）' },
      { sec: '前奏 Intro', word: '♫ 前奏3', note: 'F5 (高音Fa)', key: "'", phrase: '（空靈旋律）' },
      { sec: '前奏 Intro', word: '♫ 前奏4', note: 'Ab4 (降La)', key: 'Y', phrase: '（低音下行）' },
      { sec: '前奏 Intro', word: '♫ 前奏5', note: 'C5 (高音Do)', key: 'K', phrase: '（空拍留白）' },
      { sec: '前奏 Intro', word: '♫ 前奏6', note: 'F4 (Fa)', key: 'F', phrase: '（準備進歌）' },

      // === 主歌 1 VERSE 1 ===
      { sec: '主歌 1', word: '不', note: 'Eb4 (降Re)', key: 'E', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '要', note: 'F4 (Fa)', key: 'F', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '說', note: 'F4 (Fa)', key: 'F', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '他', note: 'Db4 (降Do)', key: 'W', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '已', note: 'Eb4 (降Re)', key: 'E', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '遠', note: 'F4 (Fa)', key: 'F', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '走', note: 'Ab4 (降La)', key: 'Y', phrase: '不要說 他已遠走' },

      { sec: '主歌 1', word: '而', note: 'Db4 (降Do)', key: 'W', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '我', note: 'Eb4 (降Re)', key: 'E', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '卻', note: 'F4 (Fa)', key: 'F', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '停', note: 'Db4 (降Do)', key: 'W', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '留', note: 'Db4 (降Do)', key: 'W', phrase: '而我卻停留' },

      { sec: '主歌 1', word: '多', note: 'Db4 (降Do)', key: 'W', phrase: '多少等候 落空' },
      { sec: '主歌 1', word: '少', note: 'Eb4 (降Re)', key: 'E', phrase: '多少等候 落空' },
      { sec: '主歌 1', word: '等', note: 'F4 (Fa)', key: 'F', phrase: '多少等候 落空' },
      { sec: '主歌 1', word: '候', note: 'Ab4 (降La)', key: 'Y', phrase: '多少等候 落空' },
      { sec: '主歌 1', word: '落', note: 'F4 (Fa)', key: 'F', phrase: '多少等候 落空' },
      { sec: '主歌 1', word: '空', note: 'Eb4 (降Re)', key: 'E', phrase: '多少等候 落空' },

      { sec: '主歌 1', word: '多', note: 'Db4 (降Do)', key: 'W', phrase: '多少寂寞 滲透' },

    function updateUI() {
      const item = currentDataset[noteIdx];

      // 更新進度
      const pct = Math.round((noteIdx / (currentDataset.length - 1)) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('lblProgressPct').textContent = `${pct}%`;
      document.getElementById('lblSectionProgress').textContent = `段落：${item.sec} (${noteIdx + 1}/${currentDataset.length})`;

      // 更新段落按鈕
      document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
      const activeSec = [...sections].reverse().find(s => noteIdx >= s.idx);
      if (activeSec) {
        const b = document.getElementById(`sec-btn-${activeSec.idx}`);
        if (b) b.classList.add('active');
      }

      // 歌詞當前字高亮
      const phraseChars = item.phrase.split('');
      const lineHtml = phraseChars.map(c => {
        if (c === item.word) return `<span class="active-char">${c}</span>`;
        return c;
      }).join('');
      document.getElementById('lblPhraseLine').innerHTML = lineHtml;

      document.getElementById('keyBadge').textContent = item.key;
      document.getElementById('comboCount').textContent = combo;

      if (targetEl) targetEl.classList.add('guided');
    }

      } else {

      }

    // 調性切換
    document.getElementById('btnKeyDb').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnKeyC').classList.remove('active');
      document.getElementById('badgeKey').textContent = '原調 D♭ 大調 (100% 原聲)';
      currentDataset = melodyDb;
      updateUI();
    });

    document.getElementById('btnKeyC').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btnKeyDb').classList.remove('active');
      document.getElementById('badgeKey').textContent = '白鍵 C 調 (降半音練習)';
      currentDataset = melodyC;
      updateUI();
    });

    // 自動演示
    const btnAuto = document.getElementById('btnModeAutoDemo');
    btnAuto.addEventListener('click', function() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        this.classList.remove('active');
        return;
      }
      this.classList.add('active');

      autoTimer = setInterval(() => {
        const cur = currentDataset[noteIdx];
        pressKey(cur.key);
      }, 480);
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      noteIdx = Math.max(0, noteIdx - 1);
      updateUI();
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      noteIdx = Math.min(currentDataset.length - 1, noteIdx + 1);
      updateUI();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      noteIdx = 0;
      combo = 0;
      updateUI();
    });

    // 啟動首頁
    updateUI();
  </script>
</body>
</html>
