<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空拍 (Pause ll) - 呂允鋼琴全曲演奏與彈唱練習器</title>
  <style>
    :root {
      --bg: #0b0d11;
      --card-bg: #161922;
      --card-inner: #1f2330;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --key-white: #ffffff;
      --key-black: #1e293b;
      --active-key: #0284c7;
      --guided-white: #fef08a;
      --guided-black: #f59e0b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 40px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge-official {
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 960px;
    }

    /* 頂部進度條 */
    .progress-bar-container {
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #252a38;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.15s ease;
    }

    .sections-nav {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
    }

    .section-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .section-btn.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.18);
      font-weight: 800;
    }

    /* 核心舞台卡片 */
    .stage-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      position: relative;
    }

    .stage-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .mode-pills {
      display: flex;
      background: #1f2330;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }

    .mode-pill {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-pill.active {
      background: var(--primary);
      color: #0f172a;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3);
    }

    .combo-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 14px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* 主畫面舞台 */
    .song-stage {
      text-align: center;
      padding: 24px 16px;
      background: var(--card-inner);
      border-radius: 14px;
      position: relative;
      transition: background 0.15s;
    }

    .song-stage.success-flash {
      background: rgba(16, 185, 129, 0.25);
    }

    .phrase-context {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .phrase-context .highlight-char {
      color: #fff;
      font-weight: 800;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 2px;
    }

    .target-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .current-word {
      font-size: 64px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      line-height: 1;
    }

    .current-note {
      font-size: 38px;
      font-weight: 900;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      text-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
    }

    .chord-tag {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .prompt-box {
      font-size: 16px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .key-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #0f172a;
      font-weight: 900;
      font-size: 20px;
      padding: 6px 16px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.6);
      font-family: ui-monospace, monospace;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* 鋼琴鍵盤容器 */
    .piano-box {
      background: #14171f;
      border-radius: 16px;
      padding: 14px 16px 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      border: 2px solid #282e3d;
      position: relative;
    }

    .piano-board {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
    }

    .white-keys {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .white-key {
      flex: 1;
      height: 100%;
      background: var(--key-white);
      border: 1px solid #cbd5e1;
      border-radius: 0 0 6px 6px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      cursor: pointer;
      transition: background 0.05s, transform 0.05s;
    }

    .white-key.active {
      background: var(--active-key) !important;
      transform: translateY(2px);
    }

    .white-key.guided {
      background: var(--guided-white) !important;
      border-color: #f59e0b;
      box-shadow: inset 0 -12px 0 var(--guided-black);
    }

    .black-keys {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 135px;
      display: flex;
      pointer-events: none;
      z-index: 2;
    }

    .black-slot {
      flex: 1;
      position: relative;
    }

    .black-key {
      position: absolute;
      width: 62%;
      height: 100%;
      background: var(--key-black);
      right: -31%;
      border-radius: 0 0 5px 5px;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
      box-shadow: 2px 4px 6px rgba(0,0,0,0.6);
      transition: background 0.05s, transform 0.05s;
    }

    .black-key.active {
      background: var(--active-key) !important;
      transform: translateY(2px);
    }

    .black-key.guided {
      background: var(--guided-black) !important;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.9);
    }

    .kb-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.08);
      color: #0f172a;
      font-family: ui-monospace, Menlo, monospace;
    }

    .black-key .kb-badge {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .note-sub {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
      font-weight: 600;
    }

    .black-key .note-sub {
      color: #cbd5e1;
    }

    /* 控制動作列 */
    .control-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button.btn-ctrl {
      background: #272c38;
      color: #f1f5f9;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.btn-ctrl:hover {
      background: #333a4a;
      border-color: rgba(255,255,255,0.25);
    }

    button.btn-ctrl.active {
      background: var(--primary);
      color: #0f172a;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <span>呂允《空拍 (Pause ll)》真實琴譜全曲彈奏器</span>
      <span class="badge-official">真正主旋律單音版</span>
    </h1>
    <p>敲擊鍵盤彈奏《空拍》真實旋律與音符！每敲一個音自動跳下一個音符</p>
  </header>

  <div class="main-layout">
    <!-- 歌曲進度條 -->
    <div class="progress-bar-container">
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);">
        <span id="lblSectionProgress">進度：前奏</span>
        <span id="lblProgressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="sections-nav" id="sectionNavContainer"></div>
    </div>

    <!-- 舞台展示區 -->
    <div class="stage-card">
      <div class="stage-top">
        <div class="mode-pills">
          <button class="mode-pill active" id="btnModeMelody">🎹 真實旋律演奏模式（彈歌詞音符）</button>
          <button class="mode-pill" id="btnModeChord">🎸 彈唱和弦模式（伴奏打底）</button>
          <button class="mode-pill" id="btnModeAutoDemo">▶ 全曲旋律自動演奏</button>
        </div>

        <div class="combo-badge" id="comboBadge">

          <span id="comboCount">0</span>
        </div>

      <div class="song-stage" id="stageBox">
        <div class="phrase-context" id="lblPhrase">歌詞句：不要說 他已遠走</div>
        <div class="target-box">
          <div class="current-word" id="lblWord">不</div>
          <div class="current-note" id="lblNote">D4 (Re)</div>
        </div>
        <div>
          <span class="chord-tag" id="lblChord">伴奏和弦：Cadd9</span>
        </div>
        <div class="prompt-box">
          MacBook Air 鍵盤請敲：
          <span class="key-badge" id="keyBadge">S</span>
        </div>
      </div>
    </div>

    <!-- 鋼琴鍵盤本體 -->
    <div class="piano-box">
      <div class="piano-board">
        <div class="white-keys" id="whiteKeys"></div>
        <div class="black-keys" id="blackKeys"></div>
      </div>
    </div>

    <!-- 控制功能列 -->
    <div class="control-actions">
      <div style="display:flex; gap:8px;">
        <button class="btn-ctrl" id="btnPrev">◀ 上一個音</button>
        <button class="btn-ctrl" id="btnNext">下一個音 ▶</button>
        <button class="btn-ctrl" id="btnReset">🔄 從頭彈奏</button>
      </div>
      <div style="font-size:13px; color:var(--text-muted);">
        💡 提示：手指放在鍵盤上敲對提示鍵，系統會自動彈出真實旋律並無縫切換到下一個字！
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. 純淨平台鋼琴合成器 (Web Audio API)
    // -------------------------------------------------------------
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playPianoNote(freq, delay = 0, duration = 2.2, gainLevel = 0.38) {
      initAudio();
      const now = audioCtx.currentTime + delay;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'triangle';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 2, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(gainLevel, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(gainLevel * 0.45, now + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + duration + 0.1);
      osc2.stop(now + duration + 0.1);
    }

    // 同步輕柔伴奏底音
    function playBassNote(freq) {
      initAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq / 2, now); // 低一個八度
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.2, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 2.1);
    }

    // -------------------------------------------------------------
    // 2. MacBook 鍵盤映射 (白鍵 A S D F G H J K L ; / 黑鍵 W E T Y U O P)
    // -------------------------------------------------------------
    const keysDef = [
      { note: 'C4', key: 'A', isBlack: false, freq: 261.63, solfege: 'Do' },
      { note: 'C#4', key: 'W', isBlack: true, freq: 277.18, solfege: '升Do' },
      { note: 'D4', key: 'S', isBlack: false, freq: 293.66, solfege: 'Re' },
      { note: 'D#4', key: 'E', isBlack: true, freq: 311.13, solfege: '升Re' },
      { note: 'E4', key: 'D', isBlack: false, freq: 329.63, solfege: 'Mi' },
      { note: 'F4', key: 'F', isBlack: false, freq: 349.23, solfege: 'Fa' },
      { note: 'F#4', key: 'T', isBlack: true, freq: 369.99, solfege: '升Fa' },
      { note: 'G4', key: 'G', isBlack: false, freq: 392.00, solfege: 'Sol' },
      { note: 'G#4', key: 'Y', isBlack: true, freq: 415.30, solfege: '升Sol' },
      { note: 'A4', key: 'H', isBlack: false, freq: 440.00, solfege: 'La' },
      { note: 'A#4', key: 'U', isBlack: true, freq: 466.16, solfege: '升La' },
      { note: 'B4', key: 'J', isBlack: false, freq: 493.88, solfege: 'Si' },
      { note: 'C5', key: 'K', isBlack: false, freq: 523.25, solfege: '高音Do' },
      { note: 'C#5', key: 'O', isBlack: true, freq: 554.37, solfege: '高音升Do' },
      { note: 'D5', key: 'L', isBlack: false, freq: 587.33, solfege: '高音Re' },
      { note: 'D#5', key: 'P', isBlack: true, freq: 622.25, solfege: '高音升Re' },
      { note: 'E5', key: ';', isBlack: false, freq: 659.25, solfege: '高音Mi' },
      { note: 'F5', key: "'", isBlack: false, freq: 698.46, solfege: '高音Fa' },
    ];

    const keyMap = {};
    keysDef.forEach(k => keyMap[k.key.toUpperCase()] = k);

    const whiteContainer = document.getElementById('whiteKeys');
    const blackContainer = document.getElementById('blackKeys');

    keysDef.forEach(k => {
      if (!k.isBlack) {
        const el = document.createElement('div');
        el.className = 'white-key';
        el.id = `key-${k.key}`;
        el.innerHTML = `
          <div class="kb-badge">${k.key}</div>
          <div class="note-sub">${k.note}</div>
        `;
        el.addEventListener('mousedown', () => pressKey(k.key));
        whiteContainer.appendChild(el);

        const slot = document.createElement('div');
        slot.className = 'black-slot';
        slot.id = `slot-${k.key}`;
        blackContainer.appendChild(slot);
      } else {
        const prev = keysDef[keysDef.indexOf(k) - 1];
        const slot = document.getElementById(`slot-${prev.key}`);
        if (slot) {
          const el = document.createElement('div');
          el.className = 'black-key';
          el.id = `key-${k.key}`;
          el.innerHTML = `
            <div class="kb-badge">${k.key}</div>
            <div class="note-sub">${k.note}</div>
          `;
          el.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            pressKey(k.key);
          });
          slot.appendChild(el);
        }
      }
    });

    // -------------------------------------------------------------
    // 3. 呂允《空拍》真實主旋律音符資料庫 (全曲逐字琴譜)
    // -------------------------------------------------------------
    const melodyNotes = [
      // === 前奏 INTRO ===
      { sec: '前奏 Intro', word: '♫ 前奏1', note: 'G4', key: 'G', chord: 'Cadd9', phrase: '（鋼琴空靈前奏）' },
      { sec: '前奏 Intro', word: '♫ 前奏2', note: 'D5', key: 'L', chord: 'Cadd9', phrase: '（高音 Re）' },
      { sec: '前奏 Intro', word: '♫ 前奏3', note: 'E5', key: ';', chord: 'Cadd9', phrase: '（高音 Mi）' },
      { sec: '前奏 Intro', word: '♫ 前奏4', note: 'G4', key: 'G', chord: 'G/B', phrase: '（低音下行 Si）' },
      { sec: '前奏 Intro', word: '♫ 前奏5', note: 'B4', key: 'J', chord: 'G/B', phrase: '（留白空拍）' },
      { sec: '前奏 Intro', word: '♫ 前奏6', note: 'E4', key: 'D', chord: 'Am7', phrase: '（準備進歌）' },

      // === 主歌 1 VERSE 1 ===
      { sec: '主歌 1', word: '不', note: 'D4', key: 'S', chord: 'Cadd9', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '要', note: 'E4', key: 'D', chord: 'Cadd9', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '說', note: 'E4', key: 'D', chord: 'Cadd9', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '他', note: 'C4', key: 'A', chord: 'G/B', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '已', note: 'D4', key: 'S', chord: 'G/B', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '遠', note: 'E4', key: 'D', chord: 'G/B', phrase: '不要說 他已遠走' },
      { sec: '主歌 1', word: '走', note: 'G4', key: 'G', chord: 'G/B', phrase: '不要說 他已遠走' },

      { sec: '主歌 1', word: '而', note: 'C4', key: 'A', chord: 'Am7', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '我', note: 'D4', key: 'S', chord: 'Am7', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '卻', note: 'E4', key: 'D', chord: 'Am7', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '停', note: 'C4', key: 'A', chord: 'Am7', phrase: '而我卻停留' },
      { sec: '主歌 1', word: '留', note: 'C4', key: 'A', chord: 'Am7', phrase: '而我卻停留' },

      { sec: '主歌 1', word: '多', note: 'C4', key: 'A', chord: 'Am/G', phrase: '多少等候 落空' },
      { sec: '主歌 1', word: '少', note: 'D4', key: 'S', chord: 'Am/G', phrase: '多少等候 落空' },

    sections.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'section-btn';
      btn.id = `sec-btn-${s.idx}`;
      btn.textContent = s.name;
      btn.addEventListener('click', () => {
        noteIdx = s.idx;
        updateUI();
      });
      sectionNav.appendChild(btn);
    });

    function updateUI() {
      const item = melodyNotes[noteIdx];
      const k = keyMap[item.key];

      // 更新進度
      const pct = Math.round((noteIdx / (melodyNotes.length - 1)) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('lblProgressPct').textContent = `${pct}%`;
      document.getElementById('lblSectionProgress').textContent = `段落：${item.sec} (${noteIdx + 1}/${melodyNotes.length})`;

      // 更新段落按鈕
      document.querySelectorAll('.section-btn').forEach(b => b.classList.remove('active'));
      const activeSec = [...sections].reverse().find(s => noteIdx >= s.idx);
      if (activeSec) {
        const b = document.getElementById(`sec-btn-${activeSec.idx}`);
        if (b) b.classList.add('active');
      }

      // 更新文字
      document.getElementById('lblPhrase').textContent = item.phrase;
      document.getElementById('lblWord').textContent = item.word;
      document.getElementById('lblNote').textContent = `${item.note} (${k ? k.solfege : ''})`;
      document.getElementById('lblChord').textContent = `和弦：${item.chord}`;
      document.getElementById('keyBadge').textContent = item.key;
      document.getElementById('comboCount').textContent = combo;

      // 琴鍵高亮
      document.querySelectorAll('.key').forEach(el => el.classList.remove('guided'));
      const targetEl = document.getElementById(`key-${item.key}`);
      if (targetEl) targetEl.classList.add('guided');
    }

    function advanceNote() {
      combo++;
      const stage = document.getElementById('stageBox');
      stage.classList.add('success-flash');
      setTimeout(() => stage.classList.remove('success-flash'), 200);

      if (noteIdx < melodyNotes.length - 1) {
        noteIdx++;
      } else {
        noteIdx = 0;
      }
      updateUI();
    }

    function pressKey(char) {
      char = char.toUpperCase();
      const k = keyMap[char];
      if (!k) return;

      const target = melodyNotes[noteIdx];
      const el = document.getElementById(`key-${k.key}`);
      if (el) {
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 180);
      }

      // 彈奏該音符
      playPianoNote(k.freq);

      // 若按對當前目標音，自動加上和弦低音並前進到下一個音！
      if (char === target.key) {
        // 自動加上和弦根音，創造豐滿鋼琴聲
        if (target.chord.includes('C')) playBassNote(261.63);
        else if (target.chord.includes('G')) playBassNote(196.00);
        else if (target.chord.includes('A')) playBassNote(220.00);
        else if (target.chord.includes('F')) playBassNote(174.61);
        else if (target.chord.includes('E')) playBassNote(164.81);
        else if (target.chord.includes('D')) playBassNote(146.83);

        advanceNote();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const char = e.key.toUpperCase();
      if (keyMap[char]) pressKey(char);
    });

    // 模式切換
    document.getElementById('btnModeMelody').addEventListener('click', function() {
      clearInterval(autoTimer);
      autoTimer = null;
      document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });

    document.getElementById('btnModeAutoDemo').addEventListener('click', function() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        this.classList.remove('active');
        document.getElementById('btnModeMelody').classList.add('active');
        return;
      }
      document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      autoTimer = setInterval(() => {
        const cur = melodyNotes[noteIdx];
        pressKey(cur.key);
      }, 550); // 每半秒自動彈奏一個音
    });

    document.getElementById('btnPrev').addEventListener('click', () => {
      noteIdx = Math.max(0, noteIdx - 1);
      updateUI();
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      noteIdx = Math.min(melodyNotes.length - 1, noteIdx + 1);
      updateUI();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      noteIdx = 0;
      combo = 0;
      updateUI();
    });

    // 啟動
    updateUI();
  </script>
</body>
</html>
